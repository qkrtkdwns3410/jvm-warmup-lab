apiVersion: v1
kind: ConfigMap
metadata: { name: k6-warm-script }
data:
  warm.js: |
    import http from 'k6/http';
    export const options = { vus: 24, iterations: 24, thresholds: { http_req_failed: ['rate<0.01'], http_req_duration: ['p(95)<500'] } };
    export default function () { http.get('http://jvm-warmup-lab:8080/api/products/1'); }
---
apiVersion: batch/v1
kind: Job
metadata: { name: jvm-warmup-warm-k6 }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["run", "/scripts/warm.js"]
          volumeMounts: [{ name: script, mountPath: /scripts }]
      volumes:
        - name: script
          configMap: { name: k6-warm-script }
