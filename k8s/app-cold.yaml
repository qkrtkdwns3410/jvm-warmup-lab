apiVersion: v1
kind: Service
metadata: { name: jvm-warmup-lab }
spec:
  selector: { app: jvm-warmup-lab }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jvm-warmup-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: jvm-warmup-lab } }
  template:
    metadata: { labels: { app: jvm-warmup-lab } }
    spec:
      containers:
        - name: app
          image: jvm-warmup-lab:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: cold }
            - { name: JDBC_URL, value: "jdbc:mysql://mysql:3306/warmup_lab?useSSL=false&allowPublicKeyRetrieval=true" }
            - { name: JDBC_USERNAME, value: lab }
            - { name: JDBC_PASSWORD, value: lab }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
