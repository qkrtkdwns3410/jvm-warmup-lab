apiVersion: v1
kind: ConfigMap
metadata: { name: k6-cold-script }
data:
  cold.js: |
    import http from 'k6/http';
    import { Counter } from 'k6/metrics';
    const failures = new Counter('cold_failures');
    export const options = { vus: 24, iterations: 24, thresholds: { cold_failures: ['count>0'] } };
    export default function () { const r = http.get('http://jvm-warmup-lab:8080/api/products/1'); if (!r || r.status === 503) failures.add(1); }
---
apiVersion: batch/v1
kind: Job
metadata: { name: jvm-warmup-cold-k6 }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["run", "/scripts/cold.js"]
          volumeMounts: [{ name: script, mountPath: /scripts }]
      volumes:
        - name: script
          configMap: { name: k6-cold-script }
